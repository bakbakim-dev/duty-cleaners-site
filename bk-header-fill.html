<!-- Duty Cleaners brand styles: BEGIN -->
<style>
/*
 * Duty Cleaners brand layer for the BookingKoala booking pages.
 * Published in Theme Builder -> Settings -> Tracking & Conversion -> Header code,
 * inside its own marked <style> block (site/scripts/build-booking-prefill.mjs).
 *
 * Colours are the site's own tokens (site/src/index.css):
 *   navy   #1c3c63  (--brand-navy)  selected states, headings
 *   accent #c23e0a  (--accent)      action buttons, prices
 *   ink    #263140  (--foreground)  body text
 * BookingKoala writes its theme colour (#00d0ff) into per-element rules
 * (#elem_...), so these overrides use !important. Cosmetic only: nothing here
 * hides a field or changes what the form submits.
 */
@import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap");

:root {
  --dc-navy: #1c3c63;
  --dc-navy-dark: #152f4f;
  --dc-accent: #c23e0a;
  --dc-accent-dark: #a33408;
  --dc-ink: #263140;
}

/* Type: the site's system sans for body copy; Fraunces only for the page
   heading, as the site's funnel uses it only for step headings. */
body,
button,
input,
select,
textarea,
.btn,
.form-control,
.form-select {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif !important;
}
.bk-title {
  font-family: "Fraunces", Georgia, "Times New Roman", serif !important;
  color: var(--dc-navy) !important;
  letter-spacing: -0.01em;
}
.bk-form-title {
  color: var(--dc-navy) !important;
}

/* Logos (brand/booking-logo*.png): BookingKoala forces a 50px height with
   object-fit: fill, which squashed the wide mark to 72x50 in the header.
   Keep the image's own proportions, capped at 48px tall. */
img[src*="duty-cleaners-booking-logo"] {
  width: auto !important;
  height: auto !important;
  max-width: none !important;
  max-height: 48px !important;
  object-fit: contain;
}

/* Action buttons (Book My Clean, Apply, cookie OK): the site's orange. */
.btn-primary,
.bk-cookie-acpt-btn {
  background-color: var(--dc-accent) !important;
  border-color: var(--dc-accent) !important;
  color: #fff !important;
}
.btn-primary:hover,
.btn-primary:focus,
.bk-cookie-acpt-btn:hover {
  background-color: var(--dc-accent-dark) !important;
  border-color: var(--dc-accent-dark) !important;
}
.bk-cookie-set-btn {
  color: var(--dc-navy) !important;
}

/* Chosen options (frequency, arrival time, tabs): navy, as in the site's funnel. */
.bk-form-check-input:checked + .bk-form-check-btn,
.btn-check:checked + .btn,
.btn-check:checked + label,
label.btn.active,
.btn-light.active {
  background-color: var(--dc-navy) !important;
  border-color: var(--dc-navy) !important;
  color: #fff !important;
}
/* BookingKoala styles the chosen frequency with an ID-scoped !important rule
   (#elem_... .bk-form-check-input:checked + label). :is() takes the weight of
   its most specific argument, and the extra class outranks their rule, which
   is injected later in the page, without naming their IDs. */
:is(#dc-brand, [id^="elem_"]) .bk-form-check-input:checked + label.bk-form-check-btn {
  background-color: var(--dc-navy) !important;
  border-color: var(--dc-navy) !important;
  color: #fff !important;
}
.nav-tabs .nav-link.active,
.nav-link.active {
  border-color: var(--dc-accent) !important;
  color: var(--dc-navy) !important;
}
.form-check-input:checked {
  background-color: var(--dc-navy) !important;
  border-color: var(--dc-navy) !important;
}
.form-control:focus,
.form-select:focus,
.form-check-input:focus {
  border-color: var(--dc-navy) !important;
  box-shadow: 0 0 0 0.2rem rgba(28, 60, 99, 0.25) !important;
}

/* Prices in the summary: the site's accent (BookingKoala's #fc6011 fails
   contrast on white). */
.tjs-summary__total,
.bk-form-sum-tbt-value,
.bk-form-sum-total-value {
  color: var(--dc-accent) !important;
}

/* Phone summary bar: two stacked totals had no labels. */
#summary-price-mini {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}
#summary-price-mini .bk-form-sum-tbt-value::before,
#summary-price-mini .bk-form-sum-total-value::before {
  display: block;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: #52616b;
  line-height: 1.2;
}
#summary-price-mini .bk-form-sum-tbt-value::before {
  content: "Before GST";
}
#summary-price-mini .bk-form-sum-total-value::before {
  content: "With 5% GST";
}
#summary-price-mini .tjs-summary__total {
  display: block !important;
  width: auto !important;
  text-align: right;
  white-space: nowrap;
  font-size: 18px;
}

/* Tap targets: tick boxes and footer links were 16-27px tall. */
.form-check-input.bk-form-extra-input,
.form-check-input {
  min-width: 24px;
  min-height: 24px;
}
footer .btn-link,
.footer .btn-link {
  min-height: 44px;
  display: inline-flex !important;
  align-items: center;
}

/* ---------------------------------------------------------------------------
   Taste pass (2026-09-21): the funnel's rules carried onto the booking page.
   One accent (orange) for the action button and the prices; navy for
   everything chosen or active; readable controls; no BookingKoala orange
   (#fc6011) or cyan (#00d0ff) left anywhere.
   ------------------------------------------------------------------------ */

/* Section headings: weight, not size, carries the hierarchy. */
h4.bk-form-title {
  font-weight: 600 !important;
  letter-spacing: -0.01em;
}

/* Controls: 16px text (smaller makes iOS zoom the page on focus), ink
   colour, and an edge that meets 3:1 against white. */
.form-control,
.form-select,
.bk-input,
.bk-select {
  font-size: 16px !important;
  color: var(--dc-ink) !important;
  border-color: #8595a4 !important;
  border-radius: 6px !important;
}
.form-control::placeholder {
  color: #6b7885 !important;
  opacity: 1;
}

/* Unchosen frequency options: a white chip with an edge, not grey on grey. */
label.btn-light.bk-form-check-btn,
.bk-form-check-btn.btn-light {
  background-color: #fff !important;
  border: 1px solid #8595a4 !important;
  color: var(--dc-ink) !important;
  border-radius: 6px !important;
}
label.btn-light.bk-form-check-btn:hover {
  border-color: var(--dc-navy) !important;
}

/* Tabs (service type, coupon / gift card): a navy underline. */
.tjs-tab__link::after {
  background-color: var(--dc-navy) !important;
}

/* Extras: the site's control edge, rounded like the rest, navy when chosen. */
.bk-form-extra {
  border-color: #8595a4 !important;
  border-radius: 6px !important;
  transition: border-color 150ms;
}
.bk-form-extra:hover {
  border-color: var(--dc-navy) !important;
}
.bk-form-extra:has(.bk-form-extra-input:checked) {
  border: 2px solid var(--dc-navy) !important;
}

/* Summary: labels in navy, figures in the accent; the recurring line no
   longer shouts at 22px in BookingKoala's orange. */
.bk-form-sum-total-label,
.bk-form-sum-fst-apt-label {
  color: var(--dc-navy) !important;
}
.bk-form-sum-fst-apt-label {
  font-size: 18px !important;
}
.bk-form-sum-fst-apt-value,
.bk-form-sum-fst-apt-value bk-amount-display {
  color: var(--dc-accent) !important;
}

/* The one action button: same height and weight as the funnel's, and it
   gives a little when pressed. */
.btn-primary.btn-lg {
  font-size: 20px !important;
  border-radius: 999px !important;
  min-height: 56px;
}
.btn-primary:active {
  transform: scale(0.98);
}
@media (prefers-reduced-motion: reduce) {
  .btn-primary:active { transform: none; }
}
</style>
<!-- Duty Cleaners brand styles: END -->

<script>
(function () {
  'use strict';
  // Travel fee by postal code (owner, 2026-09-22). BookingKoala's travel fee is
  // an extra the customer ticked by hand ("Outside Edmonton/Calgary ... Do not
  // select this if you live inside Edmonton/Calgary"), so nearby-town bookings
  // went through without it and Red Deer customers could tick it by mistake.
  // This keeps the box in step with the postal code the customer enters: ticked
  // outside Edmonton, Calgary and Red Deer city limits, unticked inside them,
  // with a note saying which and why. It acts once per postal code, so a
  // customer who changes the box afterwards keeps their choice; the office
  // confirms before the clean. Runs for every /booknow visit, funnel or not.

  var CITY_BY_PREFIX = { T5: 'Edmonton', T6: 'Edmonton', T2: 'Calgary', T3: 'Calgary' };
  var CITY_BY_FSA = { T1Y: 'Calgary', T3Z: null, T4N: 'Red Deer', T4P: 'Red Deer', T4R: 'Red Deer' };
