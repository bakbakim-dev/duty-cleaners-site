<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/logo.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Scroll-reveal opt-in. ~1,750 section wrappers ship prerendered at
         opacity:0 and are revealed by an IntersectionObserver. Without this
         flag those sections stay invisible forever whenever the observer never
         runs: JS disabled, or the bundle failing to boot. Setting it here (not
         from React) means the hidden start state applies before first paint, so
         there is no flash of content that then snaps away.
         The timeout is the failsafe for the bundle-error case: if React has not
         mounted after 4s, drop the flag and let the prerendered HTML show. -->
    <!-- Deliberately one line: the CSP in public/_headers pins a sha256 of this
         script's exact bytes, and a multi-line body would hash differently
         depending on whether the file is checked out with LF or CRLF. -->
    <script>document.documentElement.dataset.motion="on";setTimeout(function(){if(!window.__dcMounted)document.documentElement.removeAttribute("data-motion")},4000);</script>



    <title>Duty Cleaners | House Cleaning in Edmonton & Calgary</title>
    <!-- Per-page title/description/OG/Twitter come from react-helmet-async on
         every route. Static copies here would duplicate them in the prerendered
         head, so only the tags Helmet does NOT manage live below. -->
    <meta name="author" content="Duty Cleaners" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />



    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "@id": "https://dutycleaners.ca/#org",
        "name": "Duty Cleaners",
        "url": "https://dutycleaners.ca/",
        "logo": "https://dutycleaners.ca/logo.png",
        "image": "https://dutycleaners.ca/og-image.jpg",
        "email": "support@dutycleaners.ca",
        "telephone": "+1-780-913-6565",
        "description": "Professional house cleaning services in Edmonton, Calgary, and across Alberta.",
        "sameAs": [
          "https://www.google.com/maps?cid=8192121191672692049",
          "https://www.google.com/maps?cid=6193344199307583189",
          "https://www.google.com/maps?cid=10449244954117051184",
          "https://www.yelp.ca/biz/duty-cleaners-calgary-calgary",
          "https://www.facebook.com/dutycleaners/",
          "https://www.instagram.com/dutycleaners/",
          "https://www.linkedin.com/company/duty-cleaners/",
          "https://www.youtube.com/@dutycleaners2795",
          "https://x.com/Dutycleaners"
        ],
        "foundingDate": "2017",
        "knowsAbout": [
          "House cleaning",
          "Deep cleaning",
          "Move-in and move-out cleaning",
          "Recurring house cleaning",
          "Post-construction cleaning",
          "Wall washing",
          "Airbnb turnover cleaning",
          "Office cleaning",
          "Military housing march-out cleaning"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "18615 71 Ave NW",
          "addressLocality": "Edmonton",
          "addressRegion": "AB",
          "postalCode": "T5T 2V9",
          "addressCountry": "CA"
        },
        "subOrganization": [
          { "@id": "https://dutycleaners.ca/#edmonton" },
          { "@id": "https://dutycleaners.ca/#calgary" },
          { "@id": "https://dutycleaners.ca/#reddeer" }
        ],
        "potentialAction": {
          "@type": "ReserveAction",
          "name": "Get an instant house-cleaning price and book online",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://dutycleaners.ca/?quote#quote",
            "actionPlatform": [
              "https://schema.org/DesktopWebPlatform",
              "https://schema.org/MobileWebPlatform"
            ]
          },
          "result": { "@type": "Reservation", "name": "House cleaning appointment" }
        }
      }
    </script>
    <!-- potentialAction: the machine-readable entry point for starting a
         booking. Google only consumes ReserveAction through partner programs,
         but AI agents parsing the entity graph (Phase 5B of the audit) get a
         declared, stable URL for "begin a reservation" instead of having to
         infer it from CTA buttons — the schema-first half of agentic
         readiness. The funnel itself is client-side; the fallback for non-JS
         agents remains the prose pricing + tel: links, which are prerendered
         on every page. -->

  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
