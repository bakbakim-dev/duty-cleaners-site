<script>
    (function () {
        try {
            var APP_ID = 'hhs52p/project-2-v6';
            var ALLOWED = ['deetsmobile', 'cleanzen', 'atlantagreenmaids', 'gustoshomehub']; // add accounts here; [] = enable on all hosts
            var host = window.location.hostname;
            if (ALLOWED.length && !ALLOWED.some(function (h) { return host.indexOf(h) !== -1; })) {
                return;
            }

            var lr = document.createElement('script');
            lr.src = 'https://cdn.logr-in.com/LogRocket.min.js';
            lr.async = true;
            lr.crossOrigin = 'anonymous';
            lr.onload = function () {
                try {
                    window.LogRocket.init(APP_ID);
                    var u = JSON.parse(localStorage.getItem('currentUser') || 'null');
                    if (u && u.id) {
                        window.LogRocket.identify(String(u.id+' '+host), {
                            role: u.role || '', 
                            merchant: host
                        });
                    }
                } catch (e) {
                    /* ignore */
                }
            };
            lr.onerror = function () {
                /* ignore */
            };
            document.body.appendChild(lr);
        } catch (e) {
            /* ignore */
        }
        })();
</script>
